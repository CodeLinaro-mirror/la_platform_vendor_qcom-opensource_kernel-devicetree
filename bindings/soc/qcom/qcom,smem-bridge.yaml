%YAML 1.2
---
$id: "http://devicetree.org/schemas/soc/qcom/qcom,smem-bridge.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Qualcomm modem corruption counter SMEM bridge

maintainers:
  - linux-arm-msm@vger.kernel.org

description: |
  This driver exposes efs corruption counters located in a Qualcomm SMEM
  entry through a read-only sysfs node (`smem-item`) for user-space to
  access it.

properties:
  compatible:
    const: qcom,smem-bridge

  qcom,smem-item:
    description: SMEM item ID that contains the corruption counters.
    $ref: /schemas/types.yaml#/definitions/uint32

  qcom,smem-offset:
    description: Byte offset within the selected SMEM item.
    $ref: /schemas/types.yaml#/definitions/uint32

required:
  - compatible
  - qcom,smem-item
  - qcom,smem-offset

additionalProperties: false

examples:
  - |
    qcom_smem_bridge {
      compatible = "qcom,smem-bridge";
        qcom,smem-item = <627>;
        qcom,smem-offset = <0>;
    };

...
