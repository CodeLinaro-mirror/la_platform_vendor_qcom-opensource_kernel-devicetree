%YAML 1.2
---
$id: "http://devicetree.org/schemas/net/qrtr-ethernet-dev.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: QTI QRTR Ethernet Device transport binding

maintainers:
        - Arun Prakash P P <app@quicinc.com>

description: |
  Configuration properties for the qrtr ethernet Transport. This configuration
  is to instantiate a transport for IPC Router protocol communication between
  MSM and MDM over ethernet interface.

properties:
  compatible:
    const: qcom,qrtr-ethernet-dev

  qcom,net-id:
    $ref: '/schemas/types.yaml#/definitions/u32'
    description: Indicates what subnet this transport belongs to. Should be
                 passed into the qrtr core logic to determine if forwarding
                 is needed on this endpoint.

  qcom,low-latency:
    $ref: '/schemas/types.yaml#/definitions/bool'
    description: Indicates whether this transport receiving thread needs to
                 be set to realtime priority for enhanced performance.

required:
  -compatible

examples:
  - |
    qcom,eth_dev_qrtr {
       compatible = "qcom,qrtr-ethernet-dev";
       qcom,net-id = <4>;
       qcom,low-latency;
    };
